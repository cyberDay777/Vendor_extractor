name: My Custom Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  my-job-name:
    runs-on: ubuntu-latest
   
    steps:
      - name: Cleanup Space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set up SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa.pub
          cat ~/.ssh/id_rsa.pub
          ssh-keyscan -t rsa gitlab.com >> ~/.ssh/known_hosts
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"
          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"
          sleep 60

      - name: Clone repositories
        run: |
          git clone https://dumps.tadiphone.dev/dumps/xiaomi/chenfeng.git -b missi-user-15-AQ3A.240912.001-OS2.0.2.0.VNJINXM-release-keys ~/holi 
          cd ~/holi
          cd aosp-device-tree
          git init 
          git add .
          git commit -m "chenfeng; initial tree generated by AOSPDTGEN"
          git branch -M main 
          git remote add origin git@github.com:Fake-suns/device_xiaomi_chenfeng.git
          git push -u origin main
